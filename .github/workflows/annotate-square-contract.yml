name: Annotate square-baseline compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/annotate-square-contract.yml'

permissions:
  contents: write

jobs:
  annotate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add dormant compatibility markers
        shell: pwsh
        run: .\tools\annotate_square_contract.ps1
      - name: Commit generated metadata
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channel/stable/files/lib__StrategyLab__StrategyEditorMaps046.ahk channel/stable/files/lib__StrategyLab__StrategyEditorPlacements.ahk channel/stable/files.manifest
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "ci(lab): preserve dormant footprint contract markers"
          git push origin HEAD:main
