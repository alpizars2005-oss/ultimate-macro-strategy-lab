name: Strategy Lab runtime contract

on:
  push:
    branches: [main]
    paths:
      - 'channel/stable/files/**'
      - 'channel/stable/files.map'
      - 'tools/repair_strategy_lab.ps1'
      - 'tools/install_clean_strategy_lab.ps1'
      - 'tests/ahk_contract_harness.ahk'
      - 'tests/strategy_encoding_test.ahk'
      - '.github/workflows/lab-runtime-contract.yml'
  pull_request:
    paths:
      - 'channel/stable/files/**'
      - 'channel/stable/files.map'
      - 'tools/repair_strategy_lab.ps1'
      - 'tools/install_clean_strategy_lab.ps1'
      - 'tests/ahk_contract_harness.ahk'
      - 'tests/strategy_encoding_test.ahk'
      - '.github/workflows/lab-runtime-contract.yml'

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce Strategy Lab compatibility and canvas architecture
        shell: python
        run: |
          from pathlib import Path

          stable = Path('channel/stable/files')
          ahk = '\n'.join(p.read_text(encoding='utf-8-sig') for p in stable.glob('*.ahk'))
          mapping = Path('channel/stable/files.map').read_text(encoding='utf-8')
          launcher = (stable / 'run_lab.bat').read_text(encoding='utf-8-sig')
          updater = (stable / 'submacros__lab_update.ps1').read_text(encoding='utf-8-sig')
          validation = (stable / 'lib__StrategyLab__LabStrategyValidation.ahk').read_text(encoding='utf-8-sig')
          core = (stable / 'lib__StrategyLab__StrategyEditorCore.ahk').read_text(encoding='utf-8-sig')
          tab = (stable / 'lib__StrategyLab__StrategyEditorTab.ahk').read_text(encoding='utf-8-sig')
          ui = (stable / 'lib__StrategyLab__StrategyEditorUi.ahk').read_text(encoding='utf-8-sig')
          placements = (stable / 'lib__StrategyLab__StrategyEditorPlacements.ahk').read_text(encoding='utf-8-sig')
          maps = (stable / 'lib__StrategyLab__StrategyEditorMaps.ahk').read_text(encoding='utf-8-sig')
          interaction = (stable / 'lib__StrategyLab__StrategyEditorInteraction.ahk').read_text(encoding='utf-8-sig')
          workspace = (stable / 'lib__StrategyLab__StrategyEditorWorkspace.ahk').read_text(encoding='utf-8-sig')
          stability = (stable / 'lib__StrategyLab__LabEditorStability.ahk').read_text(encoding='utf-8-sig')
          remote = (stable / 'lib__StrategyLab__LabRemoteGate.ahk').read_text(encoding='utf-8-sig')
          stats = (stable / 'lib__StrategyLab__LabStatsTab.ahk').read_text(encoding='utf-8-sig')
          reward_catalog = (stable / 'lib__StrategyLab__LabRewardCatalog.ahk').read_text(encoding='utf-8-sig')
          reward_tracker = (stable / 'lib__StrategyLab__LabRewardTracker.ahk').read_text(encoding='utf-8-sig')
          rewards_ini = (stable / 'Resources__StrategyLab__Rewards__catalog.ini').read_text(encoding='utf-8-sig')
          remote_settings = (stable / 'submacros__lab_remote_settings.ps1').read_text(encoding='utf-8-sig')
          preflight = (stable / 'submacros__lab_preflight.ps1').read_text(encoding='utf-8-sig')
          clean_installer = Path('tools/install_clean_strategy_lab.ps1').read_text(encoding='utf-8-sig')

          assert '&this.' not in ahk
          assert 'LabStrategyReadText' not in validation + core
          assert 'LabStrategyReadFile' in validation and 'LabStrategyReadFile(path)' in core
          assert 'FileRead(path, "RAW")' in validation
          assert 'LabStrategyTrimTerminalNuls' in validation

          # 0.4 architecture: no placement/ring HWNDs. One screenshot Picture owns all
          # placement graphics; interaction is geometric.
          assert 'LabSimpleFootprints.ahk' not in tab
          assert 'MainGui.Add("Text"' not in placements
          assert 'MainGui.Add("Picture"' not in placements
          assert 'DestroyWindow' not in placements
          assert 'LabEditorHitRegions' in placements
          assert 'StrategyEditorHitTestPlacement' in placements
          assert 'StrategyEditorBeginDrag' in placements
          assert 'Gdip_FillEllipse' in maps and 'Gdip_DrawEllipse' in maps
          assert 'StrategyEditorRenderCompositeFrame' in maps
          assert 'LabEditorHitRegions.Push' in maps
          assert 'StrategyEditorHitTestPlacement(mx, my)' in interaction
          assert 'StrategyEditorSlotColor' in placements
          assert 'return "Radii: All"' in placements

          # Editor map/tower visuals are local only: exact screenshot + generated badges.
          assert 'LabMapCameraPath(mapName)' in maps
          assert 'LabMapPreferredBackground' not in maps
          assert 'LabTowerPortraitPath' not in maps
          assert 'lab_assets.ps1' not in maps
          assert 'submacros/lab_assets.ps1|' not in mapping
          assert 'lib/StrategyLab/LabSimpleFootprints.ahk|' not in mapping
          assert 'Map source: exact screenshot' in maps
          assert 'StrategyEditorSetCircularRegion(LabEditorTowerPortrait, 62)' in ui

          # Native lifecycle guards cover Editor and Stats teardown.
          assert 'LabEditorControlAlive' in stability and 'user32\\IsWindow' in stability
          assert 'LabEditorLifecycleExit' in stability
          assert 'return LabEditorControlVisible(LabEditorCanvasBg) || LabEditorControlVisible(LabEditorSnapshot)' in interaction
          assert 'LabEditorControlVisible(LabEditorCanvasBg) || LabEditorControlVisible(LabEditorSnapshot)' in workspace
          assert 'LabStatsControlVisible(LabStatsState)' in stats
          assert 'LabStatsControlAlive' in stats

          assert 'lib/StrategyLab/LabEditorStability.ahk|' in mapping
          assert 'lib/StrategyLab/LabStatsTab.ahk|' in mapping
          assert 'lib/StrategyLab/LabRewardCatalog.ahk|' in mapping
          assert 'lib/StrategyLab/LabRewardTracker.ahk|' in mapping
          assert 'submacros/lab_reward_assets.ps1|' in mapping
          assert 'Resources/StrategyLab/Rewards/catalog.ini|' in mapping
          assert 'SetTimer(LabRewardMaybeSyncAssets, -6000)' in reward_catalog
          assert 'special_drops":[]' in reward_tracker
          for required in ['[Coin]','[Gem]','[Experience]','[Spin Ticket]','[Revive Ticket]','[Time Scale Ticket]']:
              assert required in rewards_ini

          assert 'lab_syntax_probe.ps1' in launcher
          assert 'lab_syntax_probe.ps1' in updater and 'Restore-AppliedFiles' in updater
          assert 'Discord Remote' in remote and 'LabRemoteWebhookBtn' in remote
          assert '[Drawing.Point]::new' in remote_settings and '[Drawing.Size]::new' in remote_settings
          assert 'New-Object Drawing.Point(' not in remote_settings
          assert 'New-Object Drawing.Size(' not in remote_settings
          assert '[switch]$SelfTest' in remote_settings
          assert '<StrategyLabRemoteBoundary>' in preflight
          assert 'LabRemoteConsumeBetweenMatches(&switched, &stratName)' in preflight
          assert 'StrategyEditorCreateTab(MainGui)' in clean_installer
          assert 'LabStatsCreateTab(MainGui)' in clean_installer
          assert '"Editor", "Stats", "Credits"' in clean_installer

      - name: Parse every PowerShell helper and recovery tool
        shell: pwsh
        run: |
          $files = @(
            'channel/stable/files/submacros__lab_reward_assets.ps1',
            'channel/stable/files/submacros__lab_update.ps1',
            'channel/stable/files/submacros__lab_preflight.ps1',
            'channel/stable/files/submacros__lab_syntax_probe.ps1',
            'channel/stable/files/submacros__lab_fingerprint.ps1',
            'channel/stable/files/submacros__lab_discord_worker.ps1',
            'channel/stable/files/submacros__lab_remote_settings.ps1',
            'tools/repair_strategy_lab.ps1',
            'tools/install_clean_strategy_lab.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse failure: $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

  autohotkey-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned AutoHotkey v2 parser
        shell: pwsh
        run: |
          $url = 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip'
          Invoke-WebRequest -Uri $url -OutFile ahk.zip
          Expand-Archive -Path ahk.zip -DestinationPath ahk -Force
          $exe = Get-ChildItem -Path ahk -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          if (!$exe) { throw 'AutoHotkey64.exe not found in release archive.' }
          "AHK_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate Strategy Lab against upstream function signatures
        shell: pwsh
        run: |
          $script = (Resolve-Path 'tests/ahk_contract_harness.ahk').Path
          $psi = New-Object Diagnostics.ProcessStartInfo
          $psi.FileName = $env:AHK_EXE
          $psi.Arguments = '/Validate /ErrorStdOut=UTF-8 "' + $script + '"'
          $psi.WorkingDirectory = (Get-Location).Path
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $proc = New-Object Diagnostics.Process
          $proc.StartInfo = $psi
          if (!$proc.Start()) { throw 'Could not launch AutoHotkey validator.' }
          $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
          $stderrTask = $proc.StandardError.ReadToEndAsync()
          if (!$proc.WaitForExit(30000)) {
            try { $proc.Kill() } catch {}
            throw 'AutoHotkey /Validate timed out after 30 seconds.'
          }
          $stdout = $stdoutTask.GetAwaiter().GetResult()
          $stderr = $stderrTask.GetAwaiter().GetResult()
          if ($stdout) { Write-Host $stdout }
          if ($stderr) { Write-Host $stderr }
          if ($proc.ExitCode -ne 0 -or (($stdout + $stderr) -match '(?im)^Error:')) {
            throw "AutoHotkey /Validate failed with exit code $($proc.ExitCode)."
          }

      - name: Run strategy encoding compatibility fixtures
        shell: pwsh
        run: |
          $script = (Resolve-Path 'tests/strategy_encoding_test.ahk').Path
          $psi = New-Object Diagnostics.ProcessStartInfo
          $psi.FileName = $env:AHK_EXE
          $psi.Arguments = '/ErrorStdOut=UTF-8 "' + $script + '"'
          $psi.WorkingDirectory = (Get-Location).Path
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $proc = New-Object Diagnostics.Process
          $proc.StartInfo = $psi
          if (!$proc.Start()) { throw 'Could not launch AutoHotkey encoding test.' }
          $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
          $stderrTask = $proc.StandardError.ReadToEndAsync()
          if (!$proc.WaitForExit(30000)) {
            try { $proc.Kill() } catch {}
            throw 'AutoHotkey encoding test timed out after 30 seconds.'
          }
          $stdout = $stdoutTask.GetAwaiter().GetResult()
          $stderr = $stderrTask.GetAwaiter().GetResult()
          if ($stdout) { Write-Host $stdout }
          if ($stderr) { Write-Host $stderr }
          if ($proc.ExitCode -ne 0 -or (($stdout + $stderr) -match '(?im)^Error:')) {
            throw "AutoHotkey encoding compatibility test failed with exit code $($proc.ExitCode)."
          }

      - name: Run Discord Remote WinForms constructor self-test
        shell: powershell
        run: |
          & .\channel\stable\files\submacros__lab_remote_settings.ps1 -InstallDir (Get-Location).Path -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Discord Remote settings self-test failed with exit code $LASTEXITCODE" }
