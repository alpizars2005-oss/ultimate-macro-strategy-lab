name: Strategy Lab checks

on:
  push:
    branches: [main]
    paths:
      - 'channel/stable/files/**'
      - 'channel/stable/files.map'
      - 'tests/**'
      - '.github/workflows/lab-static-checks.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      - name: Stable channel sanity checks
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          stable = root / 'channel/stable/files'
          ahk_files = list(stable.glob('*.ahk')) + list(stable.glob('lib__StrategyLab__*.ahk'))
          joined = '\n'.join(p.read_text(encoding='utf-8-sig') for p in ahk_files)

          assert 'A_LocalAppData' not in joined, 'A_LocalAppData is not an AHK v2 built-in'
          assert not re.search(r'(?m)^\s*local\s*:=', joined), 'reserved word local used as a variable'

          mapping = root / 'channel/stable/files.map'
          targets = set()
          source_for = {}
          for raw in mapping.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              target, source, mode = [x.strip() for x in line.split('|')]
              assert target not in targets, f'duplicate target: {target}'
              targets.add(target)
              source_for[target] = source
              assert (root / source).is_file(), f'missing stable source: {source}'
              assert mode in {'raw', 'base64'}, f'bad mode: {mode}'

          required = {
              'lib/StrategyLab/StrategyEditorTab.ahk',
              'lib/StrategyLab/StrategyEditorUi.ahk',
              'lib/StrategyLab/StrategyEditorPlacements.ahk',
              'lib/StrategyLab/StrategyEditorMaps.ahk',
              'lib/StrategyLab/StrategyEditorInteraction.ahk',
              'lib/StrategyLab/StrategyEditorWorkspace.ahk',
              'lib/StrategyLab/StrategyCalibration.ahk',
              'lib/StrategyLab/MapLibrary.ahk',
              'lib/StrategyLab/TowerCatalog.ahk',
              'submacros/lab_calibration_worker.ahk',
              'submacros/lab_assets.ps1',
              'submacros/lab_update.ps1',
          }
          assert required <= targets, f'missing update targets: {sorted(required - targets)}'
          assert source_for['submacros/lab_assets.ps1'].endswith('submacros__lab_assets_v3.ps1')

          placements = (root / source_for['lib/StrategyLab/StrategyEditorPlacements.ahk']).read_text(encoding='utf-8-sig')
          assert 'LabEditorLayerOptions' in placements
          assert 'LabEditorListRowMap' in placements
          assert 'StrategyEditorRefreshLayerList' in placements
          assert 'StrategyEditorRingImagePath' in placements
          assert 'GdipDrawEllipse' in placements
          assert 'CreateEllipticRgn' in placements
          assert 'Rings: All' in placements

          ui = (root / source_for['lib/StrategyLab/StrategyEditorUi.ahk']).read_text(encoding='utf-8-sig')
          assert 'LabEditorRingsBtn' in ui
          assert 'StrategyEditorToggleRings' in ui

          workspace = (root / source_for['lib/StrategyLab/StrategyEditorWorkspace.ahk']).read_text(encoding='utf-8-sig')
          assert 'LabEditorHeaderLine.Move(20, 137, 960, 1)' in workspace
          assert 'LabEditorWorkspaceCanvasW := 646' in workspace
          assert 'SELECTED UNIT' in workspace
          assert 'PLACEMENTS' in workspace
          assert 'StrategyEditorRenderBackgroundBuffered()' in workspace
          assert 'LabEditorRingsBtn.Move(412, 177, 92, 24)' in workspace

          interaction = (root / source_for['lib/StrategyLab/StrategyEditorInteraction.ahk']).read_text(encoding='utf-8-sig')
          assert 'StrategyEditorRenderBackgroundBuffered' in interaction
          assert 'WM_SETREDRAW false' in interaction
          assert 'RedrawWindow' in interaction

          towers = (root / source_for['lib/StrategyLab/TowerCatalog.ahk']).read_text(encoding='utf-8-sig')
          assert 'LabTowerPreparePreview' in towers
          assert 'canvasSize := 320' in towers
          assert 'scale := Min(usable / sourceW, usable / sourceH)' in towers
          assert 'placementFootprint' in towers
          assert 'LabTowerPlacementFootprint' in towers

          tower_catalog = (root / source_for['Resources/StrategyLab/Towers/catalog.ini']).read_text(encoding='utf-8-sig')
          assert 'placementFootprint=1.5' in tower_catalog
          assert '[Operator]' in tower_catalog
          assert '[Warden]' in tower_catalog

          calibration = (root / source_for['submacros/lab_calibration_worker.ahk']).read_text(encoding='utf-8-sig')
          assert 'TimeWhenStartedPlaying' in calibration
          assert 'Gdip_BitmapFromScreen' in calibration
          assert 'Gdip_SaveBitmapToFile(pBitmap, temp, 86)' in calibration
          assert 'PlayStrategy()' in calibration

          bridge = (root / source_for['lib/StrategyLab/StrategyCalibration.ahk']).read_text(encoding='utf-8-sig')
          assert 'lab_calibration_worker.ahk' in bridge
          assert 'ProcessExist(LabCalibrationWorkerPid)' in bridge

          updater_ahk = (root / source_for['lib/StrategyLab/LabUpdater.ahk']).read_text(encoding='utf-8-sig')
          assert '-LauncherPath' in updater_ahk
          assert '-EntryScript' in updater_ahk

          updater_ps1 = (root / source_for['submacros/lab_update.ps1']).read_text(encoding='utf-8-sig')
          assert 'function Restart-StrategyLab' in updater_ps1
          assert 'Main_Lab.ahk' in updater_ps1

      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          $files = @(
            'channel/stable/files/submacros__lab_assets_v3.ps1',
            'channel/stable/files/submacros__lab_update.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
