name: Strategy Lab checks

on:
  push:
    branches: [main]
    paths:
      - 'channel/stable/files/**'
      - 'channel/stable/files.map'
      - 'tests/**'
      - '.github/workflows/lab-static-checks.yml'
  pull_request:
    paths:
      - 'channel/stable/files/**'
      - 'channel/stable/files.map'
      - 'tests/**'
      - '.github/workflows/lab-static-checks.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      - name: Stable channel sanity checks
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          stable = root / 'channel/stable/files'
          ahk_files = list(stable.glob('*.ahk')) + list(stable.glob('lib__StrategyLab__*.ahk'))
          joined = '\n'.join(p.read_text(encoding='utf-8-sig') for p in ahk_files)
          assert 'A_LocalAppData' not in joined
          assert not re.search(r'(?m)^\s*local\s*:=', joined)

          mapping = root / 'channel/stable/files.map'
          targets = set()
          source_for = {}
          for raw in mapping.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              target, source, mode = [x.strip() for x in line.split('|')]
              assert target not in targets, f'duplicate target: {target}'
              targets.add(target); source_for[target] = source
              assert (root / source).is_file(), f'missing stable source: {source}'
              assert mode in {'raw','base64'}

          required = {
              'run_lab.bat',
              'submacros/lab_preflight.ps1',
              'submacros/lab_watchdog_patch.ps1',
              'submacros/lab_postrun_calibrate.ps1',
              'submacros/lab_tower_assets.ps1',
              'lib/StrategyLab/StrategyEditorTab.ahk',
              'lib/StrategyLab/StrategyEditorUi.ahk',
              'lib/StrategyLab/StrategyEditorPlacements.ahk',
              'lib/StrategyLab/StrategyEditorMaps046.ahk',
              'lib/StrategyLab/StrategyEditorInteraction.ahk',
              'lib/StrategyLab/StrategyEditorWorkspace.ahk',
              'lib/StrategyLab/LabEditorHotfix044.ahk',
              'lib/StrategyLab/MapLibrary.ahk',
              'lib/StrategyLab/LabAutoMapCapture.ahk',
              'lib/StrategyLab/LabWatchdogBridge.ahk',
              'lib/StrategyLab/LabFootprintGeometry.ahk',
              'lib/StrategyLab/TowerCatalog.ahk',
              'lib/StrategyLab/LabRemoteGate.ahk',
              'lib/StrategyLab/LabStatsTab.ahk',
          }
          assert required <= targets, f'missing update targets: {sorted(required-targets)}'

          launcher = (root/source_for['run_lab.bat']).read_text(encoding='utf-8-sig')
          assert 'lab_watchdog_patch.ps1' in launcher
          assert '-InstallDir "%CD%"' in launcher

          tab = (root/source_for['lib/StrategyLab/StrategyEditorTab.ahk']).read_text(encoding='utf-8-sig')
          assert 'StrategyEditorMaps046.ahk' in tab
          assert 'LabEditorHotfix044.ahk' in tab

          maps = (root/source_for['lib/StrategyLab/StrategyEditorMaps046.ahk']).read_text(encoding='utf-8-sig')
          assert 'StrategyEditorBuildFastDragBase' in maps
          assert 'LabMapPlayableRatio()' in maps
          assert 'LabMapGetRobloxClientRect' in maps
          assert 'LabTowerPortraitPath' in maps

          maplib = (root/source_for['lib/StrategyLab/MapLibrary.ahk']).read_text(encoding='utf-8-sig')
          assert 'WinGetClientPos' in maplib
          assert 'LabMapPlayableBottomReference := 918.0' in maplib
          assert 'ClientAligned' in maplib

          footprints = (root/source_for['lib/StrategyLab/LabFootprintGeometry.ahk']).read_text(encoding='utf-8-sig')
          assert 'LabFootprintPixelsPerUnit := 26.0' in footprints
          assert 'LabFootprintPlacementCollides' in footprints

          bridge = (root/source_for['lib/StrategyLab/LabWatchdogBridge.ahk']).read_text(encoding='utf-8-sig')
          assert 'LabWatchdogCaptureOutcome' in bridge
          assert 'lab_postrun_calibrate.ps1' in bridge

          watchdog_patch = (root/source_for['submacros/lab_watchdog_patch.ps1']).read_text(encoding='utf-8-sig')
          assert 'resTriumph1' in watchdog_patch and 'resTriumph2' in watchdog_patch and 'resLost' in watchdog_patch

          postrun = (root/source_for['submacros/lab_postrun_calibrate.ps1']).read_text(encoding='utf-8-sig')
          assert 'Is-Cyan' in postrun
          assert 'postrun-cyan' in postrun
          assert 'PixelsPerUnit' in postrun

          placements = (root/source_for['lib/StrategyLab/StrategyEditorPlacements.ahk']).read_text(encoding='utf-8-sig')
          assert 'StrategyEditorRefreshLayerList' in placements
          assert 'return "Footprints: All"' in placements

          tower_assets = (root/source_for['submacros/lab_tower_assets.ps1']).read_text(encoding='utf-8-sig')
          assert 'tds.fandom.com' in tower_assets

      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          $files = @(
            'channel/stable/files/submacros__lab_tower_assets.ps1',
            'channel/stable/files/submacros__lab_reward_assets.ps1',
            'channel/stable/files/submacros__lab_watchdog_patch.ps1',
            'channel/stable/files/submacros__lab_postrun_calibrate.ps1',
            'channel/stable/files/submacros__lab_update.ps1',
            'channel/stable/files/submacros__lab_preflight.ps1',
            'channel/stable/files/submacros__lab_fingerprint.ps1',
            'channel/stable/files/submacros__lab_discord_worker.ps1',
            'channel/stable/files/submacros__lab_remote_settings.ps1'
          )
          foreach ($file in $files) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object {Write-Error $_.Message}; exit 1 }
          }
