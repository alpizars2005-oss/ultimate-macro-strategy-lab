Notes=Fixes Discord Remote settings crashing on Windows PowerShell 5.1 with System.Object[].op_Subtraction by replacing ambiguous New-Object Point/Size expressions with explicit WinForms constructors and adding a runtime self-test.|The recovery tool now stops stale Discord workers, clears stale remote command files, removes the obsolete cyan placement-ring cache, runs the Remote settings self-test, then validates the full AutoHotkey integration before launch.|Remote strategy switching is normalized on every repair/preflight: legacy/incomplete between-match hook fragments are removed and exactly one marked safe-boundary hook is installed before RunStrategy rotation logic, without touching PlayStrategy.|The editor no longer needs blue TDS-style halo Picture controls. A lightweight compatibility module destroys legacy halo controls and uses the colored placement marker itself as the footprint circle; All/Selected/Compact modes reuse the existing footprint sizes without extra image assets or HWND layers.|Strategy Lab 0.3.6 encoding compatibility remains: UTF-8/UTF-16/ANSI strategy loading, terminal-NUL compatibility and runtime encoding fixtures.|All existing calibrated maps, local tower portraits, layers, safe saves/backups, Discord commands, telemetry and F12 emergency stop remain available.
