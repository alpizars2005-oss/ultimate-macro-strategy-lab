Version=0.3.1
Notes=Hotfixes the startup parser error in LabTelemetry.ahk caused by an over-complex nested PowerShell -Command string.|Strategy fingerprinting now uses a dedicated lab_fingerprint.ps1 helper invoked with ordinary quoted file arguments, eliminating the invalid AutoHotkey expression while preserving SHA-256 run-ledger fingerprints.|The new helper is included in the stable delivery map and parsed by CI; telemetry CI now explicitly rejects embedded PowerShell -Command construction so this quoting class cannot silently return.|All Strategy Lab 0.3.0 features remain intact: Discord Remote with DPAPI token protection, safe between-match switching/stopping, F12 emergency stop, strict strategy validation, calibrated tactical maps, local portrait caching, footprint circles and atomic anti-tearing rendering.
