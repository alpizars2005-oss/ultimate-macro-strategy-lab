Version=0.2.12
Notes=Exact camera calibration is now automatic on first strategy run per map: a separate AutoHotkey worker watches the existing run-state boundary, captures the foreground Roblox client, and caches a high-resolution JPEG in AppData without interrupting PlayStrategy timing.|The exact camera frame becomes authoritative for editor coordinates on the next edit, while the downloaded Wiki top-down remains reference-only; calibration works for arbitrary strategy map names instead of a hard-coded four-map list.|Camera captures are stored as JPEG quality 86 at the Roblox client resolution, preserving the recorded coordinate plane while keeping a many-map local library much smaller than PNG screenshots.|The Lab updater now carries the current AutoHotkey launcher and entry script into the installer and uses layered restart fallbacks so completed updates relaunch the software instead of simply closing it.
