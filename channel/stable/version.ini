[Lab]
Version=0.4.0
Notes=Rebuilds the Visual Strategy Editor around one composited bitmap: the exact Roblox screenshot, placement-radius circles and numbered unit markers are rendered into a single Picture control, eliminating the square/black sibling-control stacking path from 0.3.x.|The Editor no longer needs wiki/top-down map images or website tower portraits. Capture Map stores the exact macro-camera view per map, Snapshot accepts a manual screenshot, and Refresh View simply recaptures Roblox locally.|Placement interaction is now geometric rather than HWND-based: no per-tower Gui.Controls are created. Click/drag uses canvas hit-regions, Layer filtering is applied to both the ListView and the rendered frame, and pan/zoom redraw the same authoritative canvas.|Unit radii return as true composited circles with subtle slot-colored fills/outlines; modes are Radii All, Radii 1 and Radii Off. Center markers stay compact circles with the familiar occurrence numbers/unique initials.|The right-side selected-unit vanity panel remains polished but uses a local circular badge instead of website art.|Hardens the Stats timer against destroyed controls during updater/ExitApp transitions. Existing safe saves/backups, map capture cache, Remote safe switching, RewardLibrary/drop references, encoding compatibility, telemetry and F12 emergency stop remain available.
