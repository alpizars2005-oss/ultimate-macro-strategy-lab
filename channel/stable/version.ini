Notes=Moves automatic map capture from the pre-match CheckTheMapF boundary to the beginning of SpawnTower, so legacy 0.4.2 lobby/map-vote captures are refreshed once with the exact in-match macro camera before the first unit is placed.|Fixes camera replacement failures by releasing the decoded render cache before atomic JPEG replacement; full-resolution map captures are stored locally as quality-86 JPEG plus capture-stage metadata.|Replaces disk-backed per-frame viewport JPEGs with a direct in-memory GDI+/HBITMAP canvas, substantially reducing drag, pan and zoom latency.|Placement guides now model the real tower placement footprint rather than oversized decorative rings, project X/Y independently, and highlight intersecting reserved placement areas in red.|Restores small strategy-scoped TDS Wiki tower portraits only; map imagery remains strictly local and exact-camera based.|Retains layer filtering, safe saves/backups, lifecycle guards, Discord Remote, rewards, telemetry and F12 emergency stop.
