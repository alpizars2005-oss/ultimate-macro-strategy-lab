Version=0.3.2
Notes=Fixes the AutoHotkey startup arity error in LabSafety.ahk: upstream StopStrategy is declared as StopStrategy(ctrl, *), so the F12 emergency-stop bridge now calls StopStrategy(0, 0) exactly like Ultimate Macro's own F2 handler instead of invoking it with zero arguments.|Emergency stop is now more defensive: held inputs are released before and after the stop attempt, and a fallback clears RunningStrategy and kills submacros if the upstream stop path throws.|The complete parse-safe LabTelemetry implementation from 0.3.1 remains unchanged and continues to use the dedicated lab_fingerprint.ps1 helper for SHA-256 fingerprints.|All Strategy Lab 0.3 features remain intact: Discord Remote, safe between-match commands, strict strategy validation, calibrated maps, portrait cache, footprint circles and atomic anti-tearing rendering.
