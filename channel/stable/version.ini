[Lab]
Version=0.3.0
Notes=Strategy Lab 0.3 consolidates the useful automation patterns from the macro-related repositories into one install without pulling unrelated project code into Ultimate Macro.|Discord Remote is now a first-class Lab feature: the Editor Remote button opens a local settings UI, the bot token is protected with Windows DPAPI, only the configured Discord user/channel is accepted, the worker seeds its cursor without replaying stale commands, and network polling stays outside AutoHotkey gameplay timing.|Remote commands include status, screenshot, strategy listing, start, safe between-match switch, safe stop, emergency stop, placement-ring visibility and map recalibration; start can relaunch Strategy Lab when it is not running.|The safe command bridge now loads a switched strategy before the next match, resets start-session counters cleanly, records command results in state.ini, stops submacros/releases held input on safe stop, shuts the worker down when disabled, and rejects unknown actions.|Preflight now installs the remote gate only at the high-confidence RunStrategy between-match boundary and deliberately never patches PlayStrategy; every source edit is backed up and the hook is idempotent.|Macro-Recorder-JSON reliability ideas are integrated locally: F12 is a global emergency stop with held-input release, strategy files are validated before visual editing, and low-overhead telemetry writes a run ledger plus heartbeat from official state.ini counters instead of OCR/polling inside playback.|The stable delivery map now includes all of the modules already referenced by StrategyEditorTab, fixing the partial-delivery risk from the 0.2.17 transition while preserving calibrated maps, local portrait caching, circular footprint guides and atomic anti-tearing map rendering.
