Version=0.2.15
Notes=Tower placement markers are now circular instead of square and can display cyan placement-footprint rings modeled after TDS boundary visuals.|The new Rings control cycles All, Selected and Off so dense strategies can keep every footprint visible or reduce clutter to the active tower only.|Footprint sizes are data-driven from the tower catalog: current regular-mode values are included for common Strategy Lab towers such as Operator 1.5, Warden 1.0, DJ Booth and Juggernaut 2.5, Farm and Accelerator 1.75, Spotlight Tech 2.25 and Turret 2.0; unknown towers safely fall back to Average 1.5.|Footprint overlays scale with editor zoom and follow towers live while dragging without altering strategy coordinates or save behavior.|The selected-unit card now also reports the tower footprint class/value, while the existing local portrait cache and zero-gap buffered map renderer remain unchanged.
