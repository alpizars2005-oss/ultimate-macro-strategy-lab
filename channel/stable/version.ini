Version=0.3.4
Notes=Fixes the AutoHotkey parser error in StrategyEditorCore caused by passing an object property as a ByRef target: &this.Encoding is invalid in AHK v2, so encoding detection now writes into a local variable and assigns this.Encoding afterward.|Adds a regression test that rejects any future &this. ByRef usage in the stable editor source and also verifies the required StartStrategy(0,0) and StopStrategy(0,0) compatibility calls.|UTF-16 strategy support from 0.3.3 remains intact, including preserving the detected source encoding on Save Copy and Overwrite.|Discord Remote UI hardening, visible diagnostics, Webhook-title shortcut, DPAPI token protection, safe between-match commands, calibrated maps, portrait cache, footprint circles and atomic anti-tearing rendering remain intact.
