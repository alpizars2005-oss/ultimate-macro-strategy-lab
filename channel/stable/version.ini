Version=0.4.4
Notes=Fixes the Editor drag crash where a re-entrant mouse-up could clear LabEditorDragPlacement between the IsObject guard and a later .towerId read; 0.4.4 snapshots drag state locally and never dereferences the mutable global on the hot path.|Greatly reduces Editor input lag by capping full drag composites to about 12.5 fps, coordinate field updates to 10 fps, pan repaints to about 12 fps and wheel repaint to a coalesced idle flush while preserving an immediate full-quality final frame.|Adds a gameplay UI guard: while RunningStrategy is true, Strategy Lab releases editor pointer capture and keeps MainGui hidden so the AlwaysOnTop editor can never sit on Roblox coordinates and consume the macro's absolute screen clicks.|Changes automatic map capture so the SpawnTower compatibility hook performs no capture/focus/GUI/GDI work inline; it only schedules a deferred attempt after the real placement clicks have had time to execute.|Deferred auto-capture never WinActivates or hides/shows windows; it captures only when Roblox is already foreground and retries safely if it is not, preserving macro input ordering.|Retains exact local map screenshots, true placement footprints/collision warnings, strategy-scoped TDS Wiki tower portraits, layer filtering, safe saves/backups, Discord Remote, rewards, telemetry and F12 emergency stop.
