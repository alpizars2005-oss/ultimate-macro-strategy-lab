Notes=Fixes the severe map tearing/blank-frame behavior visible while panning with placement rings enabled: the map Picture, circular tower markers and ring overlays are sibling HWNDs, so freezing only the map allowed the overlays to repaint against the black parent surface.|Navigation now freezes the entire Strategy Lab window only for the short frame-commit phase, updates the new viewport plus every marker/ring position off-screen, and performs one all-children redraw so the editor presents an atomic frame instead of several independently repainted layers.|Live pan is intentionally capped near 33 FPS and touchpad wheel bursts are coalesced around 24 ms; this trades invisible intermediate frames for a steadier GDI+/JPEG pipeline and lower UI churn.|All 0.2.16 startup-path fixes, automatic preflight repair/backups, circular markers, footprint-ring modes, local portrait cache and calibrated map workflow remain intact.
