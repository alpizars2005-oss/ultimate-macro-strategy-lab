Notes=Editor workspace stays roomy at 1000x690 and returns to the normal 700x565 size outside Editor.|Tower dragging is coalesced to about 60 FPS, live coordinate/status updates are throttled, and placement commits still use the exact final cursor position.|Pan redraw is coalesced to about 42 FPS, wheel zoom uses smaller cursor-anchored steps, and map redraw no longer rebuilds the native placement ListView.|Viewport rendering now caches the decoded source map and uses double-buffered JPEG frames to reduce disk/decode work and stale-frame flashes.|Asset sync remains strategy-scoped and stores optimized local JPEGs (tower <=256px, map <=1280x720) in AppData so the macro itself stays small.
