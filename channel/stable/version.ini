Notes=Fixes the 0.3.11 early-startup crash `global LabEditorCanvasBg has not been assigned a value`: every Strategy Editor Gui.Control global is now initialized to a safe empty sentinel before any workspace/navigation/lifecycle timer can run.|Adds a real AutoHotkey runtime smoke test that deliberately waits for early timers before StrategyEditorCreateTab exists, then destroys a native Gui.Control and verifies StrategyEditorIsActive/WorkspaceMonitor fail closed instead of throwing. This covers the startup/teardown timing window that /Validate cannot test.|Keeps 0.3.11's removal of the unstable sibling Picture-HWND footprint overlay; markers remain small circular single-HWND controls while footprint-size guides stay Safe Off until they are composited into the map frame itself.|Layer filtering, map calibration, drag/zoom, unique-tower portraits, Stats, RewardLibrary/drop references, Discord Remote safe switching, encoding compatibility, safe saves/backups, telemetry and F12 emergency stop remain available.
