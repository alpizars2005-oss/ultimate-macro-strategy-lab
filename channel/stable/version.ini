Version=0.3.11
Notes=Fixes the Windows `The control is destroyed` crash seen during updater/ExitApp transitions: Strategy Editor activity checks now validate the native HWND instead of trusting IsObject(), and editor timers fail closed during teardown.|Adds a dedicated lifecycle guard that stops workspace/interaction/portrait timers on exit and clears active-control sentinels before Windows destroys the GUI.|Temporarily retires the separate footprint Picture-HWND overlay because transparent sibling Static controls can reveal the GUI parent instead of the map Picture underneath, causing the recurring square/black visual corruption. The Lab-owned footprint-guide asset is no longer shipped and is removed from existing installs at startup.|Placement markers remain small circular single-HWND controls, including optional unique-tower portraits. Layer filtering, map calibration, drag/zoom, Stats, RewardLibrary, Discord Remote safe switching, encoding compatibility, safe saves/backups, telemetry and F12 emergency stop remain available.|Footprint-size circles will return only as map-frame-composited graphics so they cannot stack or tear against the map again.
