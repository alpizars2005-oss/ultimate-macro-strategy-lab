Version=0.4.6
Notes=Rebuilds coordinate alignment around the exact Roblox CLIENT rectangle: 0.4.5 and older screenshots used GetClientRect dimensions with screen origin 0,0, which could include the Windows title bar and vertically offset placements. 0.4.6 captures with WinGetClientPos and automatically refreshes legacy map images.|The editor now excludes the hotbar from its editable viewport while preserving Ultimate Macro strategy coordinates through a matching forward/inverse projection, so placements are aligned only against the screen area the macro can actually use.|Defines footprints as the small striped placement boundary / cyan placed-tower outline shown by TDS, not the large attack-range circle. Operator reference images establish a 26 px-per-footprint-unit baseline, replacing the undersized 12 px estimate.|Adds optional post-run calibration: the watchdog captures an exact client screenshot on Triumph/Loss before RestartMain, then an external worker detects cyan placement outlines near known SpawnTower centers and can refine per-map footprint scale and small center offsets without blocking gameplay.|Greatly reduces live editor work: panning renders terrain only until mouse-up, while dragging reuses a cached small static composite and redraws only the moving placement footprint. Full labels/collision rendering returns on the final idle frame.|Keeps strategy-scoped TDS Wiki tower portraits, layer filtering, safe saves/backups, Discord Remote, rewards, telemetry, F12 emergency stop and the 0.4.5 Win32 DllCall runtime contract.
