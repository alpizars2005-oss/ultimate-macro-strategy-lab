[Lab]
Version=0.3.5
Notes=Reliability recovery pass after the 0.3.x integration bugs: strategy encoding detection no longer uses AutoHotkey ByRef outputs at all, eliminating the &this.Encoding parser class rather than patching one call.|Every launch now runs a no-side-effect integrated AutoHotkey syntax probe against Main_Lab.ahk and all Strategy Lab includes before the macro starts; a parser/include/arity failure blocks launch and writes syntax-probe.log instead of opening another red crash dialog.|Future updates are transactional: after files are staged and applied, the bundled AutoHotkey parser validates the exact installed integration; if validation fails the updater automatically rolls the transaction back before restart.|Telemetry timers are fail-safe against missing/malformed state.ini values and cannot terminate gameplay; diagnostics are isolated to telemetry-errors.log.|Discord Remote startup is hardened: a real Discord Remote button is available on the Webhook tab in addition to the Editor button/title shortcut, settings and worker launch errors are logged, install paths with spaces are quoted correctly, and the settings window is made visible/foreground.|A standalone private-repo repair tool is available for installations too broken to reach the updater; it uses Git Credential Manager/the updater cache, verifies the stable SHA-256 manifest, backs up Lab-owned files, never touches Resources/Strats, runs preflight plus the real bundled AutoHotkey syntax check, and launches only after validation succeeds.|CI now includes static compatibility guards plus a Windows AutoHotkey v2 parser contract harness so illegal ByRef targets and StartStrategy/StopStrategy arity regressions are caught before release.|All existing Strategy Lab editor features remain: calibrated map library, local optimized tower portraits, smooth drag/pan/zoom, layers, circular placement footprint guides, safe saves/backups, Discord commands and F12 emergency stop.
