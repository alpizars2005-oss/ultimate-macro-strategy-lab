Notes=Fixes the Editor rejecting valid UTF-16 .strat files as NUL-corrupted: Strategy Lab now detects UTF-8 versus UTF-16 before validation and preserves the detected encoding when saving copies or overwriting with backup.|Discord Remote setup is hardened with a visible Windows settings dialog, startup/error logging at %APPDATA%\Ultimate_Macro\StrategyEditor\remote-settings.log, safer install-path normalization and clear errors instead of a disappearing helper process.|The existing Discord Webhook heading is now wired by preflight as a shortcut to the bot settings, while the original webhook URL controls remain unchanged; the Editor Remote button opens the same settings window.|Remote startup now calls upstream StartStrategy with the required placeholder control arguments, matching Ultimate Macro's own F1 handler and preventing another function-arity failure.|All 0.3.2 safety/telemetry fixes remain intact, including StopStrategy(0,0), F12 input release, DPAPI token protection, safe between-match commands, calibrated maps, portrait cache, footprint circles and atomic anti-tearing rendering.
