Notes=Startup now ships a preflight launcher that safely detects the exact stray bare Clear parser corruption seen in live testing, backs up Main_Lab.ahk, removes only that high-confidence bad line, and refuses ambiguous or merge-conflicted files.|Map pan/zoom no longer clears the Picture control before swapping the alternate render frame; together with buffered redraw this keeps the previous map visible until the next frame is ready and removes the one-frame black flashes visible in the supplied recording.|Tower portraits use a cached square presentation image that aspect-fits, centers and pads the entire unit render so wide/tall Wiki art is no longer cropped in the details card; prepared portrait paths are cached to keep row selection snappy.|The Editor workspace receives a professional hierarchy pass with a larger 104x104 unit card, Selected Unit and Placements sections, cleaner typography, grouped toolbar controls, aligned Position/Safe Save controls, and the compact non-Editor tabs remain unchanged.|run_lab.bat and the preflight helper are now part of the verified stable delivery map so future startup repairs happen before AutoHotkey parses Main_Lab.ahk.
