Version=0.3.6
Notes=Fixes the Visual Strategy Editor rejecting otherwise valid .strat files as containing embedded NUL bytes.|The strategy reader now inspects raw bytes first, recognizes UTF-8/UTF-16LE with or without BOM, detects legacy UTF-16 byte patterns, falls back to the Windows ANSI code page when UTF-8 decoding is not faithful, and trims harmless terminal NUL terminators while still rejecting NUL bytes embedded inside real strategy text.|Save Copy/Overwrite continue preserving UTF-8/UTF-16LE BOM behavior for normal files; uncommon UTF-16BE inputs are safely normalized to UTF-8 on an intentional save.|Adds Windows AutoHotkey runtime fixtures covering UTF-8 raw/BOM, UTF-16 raw/BOM, terminal-NUL compatibility and embedded-NUL rejection so this class of bug is tested before release.|The 0.3.5 reliability protections remain: launch-time AutoHotkey validation, transactional updater rollback, private-repo recovery, fail-safe telemetry, hardened Discord Remote, calibrated maps, local optimized tower portraits, smooth drag/pan/zoom, layers, footprint rings, backups and F12 emergency stop.
