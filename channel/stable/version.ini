Notes=Restores strict editor marker geometry after the 0.3.7 footprint regression: numbered and unique-tower markers stay on the canonical 18px/22px interaction path while footprints are separate transparent outline controls.|Replaces the old cyan TDS-style halo appearance with a small neutral footprint-guide asset; Selected is the default view, with All and Off still available.|Placement-limit-1 towers can replace their letter badge with the already-cached tower portrait without stacking a second marker HWND; missing portraits fall back safely to the normal badge.|Adds a wiki-backed RewardLibrary cache for core currencies, EXP, tickets, consumable crates and optional consumable/drop references. Reward image downloads are delayed, local, optimized and cosmetic-only so a wiki/network failure cannot block the Macro Editor.|Adds a fail-safe per-run reward ledger based only on Ultimate Macro state.ini counters: Coins, Gems and EXP deltas are recorded after win/loss counters settle, with no new OCR or screen polling inside PlayStrategy.|Discord Remote 0.3.7 fixes, safe between-match strategy switching, UTF-8/UTF-16 strategy compatibility, calibrated maps, local tower portraits, safe saves/backups, telemetry and F12 emergency stop remain available.
