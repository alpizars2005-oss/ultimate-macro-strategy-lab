[Lab]
Version=0.3.9
Notes=Rebuilds the Macro Editor placement pipeline around one authoritative visibility rule: the Editor canvas itself, not upstream CurrentTab numbering. This fixes the loaded-map-but-no-markers regression seen in 0.3.8.|Layer filtering is rewritten to resolve the actual DropDownList text, guard programmatic rebuilds and keep the ListView, selected placement, markers and footprints synchronized instead of snapping back to All placements.|Footprints now come only from the shipped neutral transparent guide; the legacy AppData-generated cyan halo path is removed completely. Default is Footprint: 1, then All, Off.|Unique placement-limit-1 tower portraits remain a marker replacement only: one HWND replaces one HWND and never owns or resizes a footprint ring.|Adds a clean Stats tab backed by state.ini and the confirmed reward ledger, with no OCR/network work.|Adds a deterministic clean-install tool that can rebuild Main_Lab.ahk from the official Main.ahk baseline, install SHA-256 verified stable Lab files, reset only Lab runtime caches, run Discord Remote self-test and AutoHotkey validation, then launch.|Existing RewardLibrary/drop references, Discord Remote safe between-match switching, encoding compatibility, safe saves/backups, map capture/calibration, telemetry and F12 emergency stop remain available.
